<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="description" content="مدیریت فروشگاه و گارانتی">
<link rel="manifest" href="manifest.json">
<title>مدیریت فروشگاه و گارانتی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#17202a}
header{background:#1565c0;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
header h1{margin:0 0 5px;font-size:20px}header p{margin:0;font-size:12px;opacity:.9}
main{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{font-size:12px;color:#53606d}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;margin-top:5px;border:1px solid #ccd5df;border-radius:9px;padding:10px;background:#fff}
textarea{min-height:150px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:9px;padding:10px 13px;background:#1565c0;color:#fff;cursor:pointer}button.secondary{background:#607d8b}button.success{background:#2e7d32}button.danger{background:#c62828}button.light{background:#e8eef5;color:#17324d}
.small{font-size:12px;color:#667}#storesList,#recordsList{display:grid;gap:10px}.item{border:1px solid #e1e7ee;border-radius:11px;padding:11px}.item strong{display:block;margin-bottom:5px}.meta{font-size:12px;color:#59636e;line-height:1.8}.codes{white-space:pre-line;direction:ltr;text-align:left;background:#f7f9fb;padding:9px;border-radius:8px;margin-top:8px;font-family:monospace;line-height:1.65}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#e3f2fd;color:#1565c0;font-size:11px;margin-left:4px}.search{margin-bottom:10px}
.empty{text-align:center;color:#78838d;padding:18px}
@media(max-width:600px){main{padding:9px}.card{padding:12px}button{flex:1;min-width:120px}}
</style>
</head>
<body>
<header><h1>🛡️ مدیریت فروشگاه و گارانتی</h1><p>ثبت، جستجو، کپی، واتساپ، تماس، پیامک، CSV و پشتیبان‌گیری</p></header>
<main>
<section class="card">
<h2>👤 اطلاعات فروشگاه / شخص</h2>
<div class="grid">
<label>نام فروشگاه / شخص<input id="storeName" placeholder="مثلاً فروشگاه راسان - مبین رسولی"></label>
<label>تلفن ۱<input id="phone1" inputmode="tel"></label>
<label>تلفن ۲<input id="phone2" inputmode="tel"></label>
<label>تلفن ۳<input id="phone3" inputmode="tel"></label>
<label>شهر<input id="city"></label>
<label>آدرس<input id="address"></label>
</div>
<div class="actions"><button class="success" onclick="saveStore()">ذخیره اطلاعات فروشگاه</button><button class="light" onclick="clearStoreForm()">پاک کردن فرم</button></div>
<div id="storesList" style="margin-top:12px"></div>
</section>

<section class="card">
<h2>🎫 ثبت گارانتی</h2>
<div class="grid">
<label>انتخاب فروشگاه
<select id="storeSelect"><option value="">— فروشگاه را انتخاب کنید —</option></select></label>
<label>تعداد کارت<input id="count" type="number" min="1" max="500" value="30"></label>
<label>تاریخ تحویل<input id="date" placeholder="1405/06/15"></label>
<label>نوع کارت
<select id="type"><option>گلد</option><option>سام</option><option>بوش</option><option>لوازم خرده‌ریز</option></select></label>
</div>
<label style="display:block;margin-top:10px">کدهای گارانتی — هر کد در یک خط (۳۰ کد همزمان قابل ثبت است)
<textarea id="codes" dir="ltr" placeholder="78601
78600
78603
..."></textarea></label>
<div class="small">کدها هنگام ذخیره، فقط به‌صورت عددی مرتب می‌شوند و موارد تکراری حذف می‌شوند. شماره‌های ۱ تا ۳۰ کنار کدها هرگز اضافه نمی‌شوند.</div>
<div class="actions"><button class="success" onclick="saveWarranty()">ثبت گارانتی</button><button class="light" onclick="clearWarrantyForm()">پاک کردن فرم</button></div>
</section>

<section class="card">
<h2>🔎 جستجو</h2>
<input id="search" class="search" placeholder="جستجو بر اساس نام، فروشگاه، شهر، تلفن یا کد..." oninput="renderRecords()">
<div id="recordsList"></div>
</section>

<section class="card">
<h2>💾 پشتیبان و خروجی</h2>
<div class="actions">
<button onclick="exportCSV()">خروجی CSV برای Excel</button>
<button class="secondary" onclick="backup()">پشتیبان‌گیری JSON</button>
<button class="secondary" onclick="document.getElementById('restoreFile').click()">بازیابی پشتیبان</button>
<button class="danger" onclick="clearAll()">حذف همه اطلاعات</button>
</div>
<input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restore(event)">
</section>
</main>
<script>
const KEY='rasanWarrantyManager_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'{"stores":[],"records":[]}');

function persist(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function normalizeDigits(s){return String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));}
function cleanCode(s){return normalizeDigits(s).trim().replace(/^\s*(?:\d+[\)\.\-:]\s+|\d+\s+)/,'').trim();}
function sortCodes(raw){
  const arr=String(raw??'').split(/\r?\n|,|،|;|\s+/).map(cleanCode).filter(Boolean);
  const unique=[...new Set(arr)];
  return unique.sort((a,b)=>{
    const na=Number(a),nb=Number(b);
    if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
    return a.localeCompare(b,'fa');
  });
}
function saveStore(){
  const s={id:crypto.randomUUID(),name:storeName.value.trim(),phone1:phone1.value.trim(),phone2:phone2.value.trim(),phone3:phone3.value.trim(),city:city.value.trim(),address:address.value.trim()};
  if(!s.name){alert('نام فروشگاه / شخص را وارد کنید.');return}
  const existing=db.stores.find(x=>x.name===s.name && x.city===s.city && x.address===s.address);
  if(existing){Object.assign(existing,s,{id:existing.id});}else db.stores.push(s);
  persist();renderStores();renderSelect();clearStoreForm();alert('اطلاعات فروشگاه ذخیره شد.');
}
function clearStoreForm(){['storeName','phone1','phone2','phone3','city','address'].forEach(id=>document.getElementById(id).value='');}
function renderStores(){
  storesList.innerHTML=db.stores.length?db.stores.map(s=>`<div class="item"><strong>${esc(s.name)}</strong><div class="meta">${esc(s.city)} ${s.address?'— '+esc(s.address):''}<br>${[s.phone1,s.phone2,s.phone3].filter(Boolean).map(esc).join(' | ')}</div><div class="actions"><button class="light" onclick="selectStore('${s.id}')">انتخاب</button><button class="danger" onclick="deleteStore('${s.id}')">حذف</button></div></div>`).join(''):'<div class="empty">هنوز فروشگاهی ثبت نشده است.</div>';
}
function renderSelect(){
  const cur=storeSelect.value;
  storeSelect.innerHTML='<option value="">— فروشگاه را انتخاب کنید —</option>'+db.stores.map(s=>`<option value="${s.id}">${esc(s.name)}${s.city?' — '+esc(s.city):''}</option>`).join('');
  if(db.stores.some(s=>s.id===cur))storeSelect.value=cur;
}
function selectStore(id){storeSelect.value=id;window.scrollTo({top:document.querySelector('#storeSelect').getBoundingClientRect().top+scrollY-100,behavior:'smooth'});}
function deleteStore(id){if(confirm('فروشگاه حذف شود؟ ثبت‌های گارانتی آن باقی می‌مانند.')){db.stores=db.stores.filter(s=>s.id!==id);persist();renderStores();renderSelect();}}
function saveWarranty(){
  const s=db.stores.find(x=>x.id===storeSelect.value);
  if(!s){alert('ابتدا یک فروشگاه را ذخیره و انتخاب کنید.');return}
  const codes=sortCodes(codesEl.value);
  const count=Number(countEl.value||0);
  if(!codes.length){alert('حداقل یک کد وارد کنید.');return}
  if(count && codes.length!==count){if(!confirm(`تعداد کارت ${count} است ولی ${codes.length} کد معتبر وارد شده. با همین ${codes.length} کد ثبت شود؟`))return}
  db.records.unshift({id:crypto.randomUUID(),storeId:s.id,store:{...s},count:codes.length,date:date.value.trim(),type:type.value,codes});
  persist();renderRecords();clearWarrantyForm();alert('گارانتی با کدهای مرتب‌شده ذخیره شد.');
}
function clearWarrantyForm(){codesEl.value='';date.value='';countEl.value=30;}
function recordText(r){
  const s=r.store||db.stores.find(x=>x.id===r.storeId)||{};
  return `🛡️ اطلاعات گارانتی
👤 ${s.name||''}
📞 ${[s.phone1,s.phone2,s.phone3].filter(Boolean).join(' | ')}
🏠 ${s.address||''} | ${s.city||''}
📍 ${s.city||''}
🎫 تعداد کارت: ${r.codes.length}
📅 تاریخ تحویل: ${r.date||''}
🛡️ نوع کارت: ${r.type||''}
🔢 کدهای گارانتی:
${r.codes.join('\\n')}`;
}
async function copyRecord(id){const r=db.records.find(x=>x.id===id);if(!r)return;await navigator.clipboard.writeText(recordText(r));alert('اطلاعات کامل کپی شد.');}
function wa(id){const r=db.records.find(x=>x.id===id);if(!r)return;const phone=(r.store.phone1||r.store.phone2||r.store.phone3||'').replace(/\\D/g,'');const text=encodeURIComponent(recordText(r));window.open(`https://wa.me/${phone}?text=${text}`,'_blank');}
function sms(id){const r=db.records.find(x=>x.id===id);if(!r)return;window.location.href=`sms:${(r.store.phone1||r.store.phone2||r.store.phone3||'').replace(/\\D/g,'')}?body=${encodeURIComponent(recordText(r))}`;}
function call(id){const r=db.records.find(x=>x.id===id);if(!r)return;window.location.href=`tel:${(r.store.phone1||r.store.phone2||r.store.phone3||'')}`;}
function editRecord(id){
  const r=db.records.find(x=>x.id===id);if(!r)return;
  storeSelect.value=r.storeId;countEl.value=r.codes.length;date.value=r.date;type.value=r.type;codesEl.value=r.codes.join('\\n');
  db.records=db.records.filter(x=>x.id!==id);persist();renderRecords();window.scrollTo({top:document.querySelector('#storeSelect').getBoundingClientRect().top+scrollY-100,behavior:'smooth'});alert('رکورد برای ویرایش در فرم بالا قرار گرفت. پس از اصلاح روی «ثبت گارانتی» بزنید.');
}
function deleteRecord(id){if(confirm('این ثبت گارانتی حذف شود؟')){db.records=db.records.filter(x=>x.id!==id);persist();renderRecords();}}
function renderRecords(){
  const q=normalizeDigits(search.value).trim().toLowerCase();
  const list=db.records.filter(r=>{const s=r.store||{};return !q || [s.name,s.city,s.address,s.phone1,s.phone2,s.phone3,r.type,r.date,...r.codes].some(v=>normalizeDigits(v).toLowerCase().includes(q));});
  recordsList.innerHTML=list.length?list.map(r=>{const s=r.store||{};return `<div class="item"><strong>${esc(s.name)} <span class="badge">${esc(r.type)}</span></strong><div class="meta">📍 ${esc(s.city)} &nbsp; 📅 ${esc(r.date)} &nbsp; 🎫 ${r.codes.length} کد</div><div class="codes">${esc(r.codes.join('\\n'))}</div><div class="actions"><button onclick="copyRecord('${r.id}')">کپی کامل</button><button onclick="wa('${r.id}')">واتساپ</button><button onclick="call('${r.id}')">تماس</button><button onclick="sms('${r.id}')">پیامک</button><button class="secondary" onclick="editRecord('${r.id}')">ویرایش</button><button class="danger" onclick="deleteRecord('${r.id}')">حذف</button></div></div>`}).join(''):'<div class="empty">موردی پیدا نشد.</div>';
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function exportCSV(){
  const rows=[['نام فروشگاه','تلفن۱','تلفن۲','تلفن۳','شهر','آدرس','تعداد کارت','تاریخ تحویل','نوع کارت','کدهای گارانتی']];
  db.records.forEach(r=>{const s=r.store||{};rows.push([s.name,s.phone1,s.phone2,s.phone3,s.city,s.address,r.codes.length,r.date,r.type,r.codes.join('\\n')]);});
  const csv='\\ufeff'+rows.map(x=>x.map(csvCell).join(',')).join('\\r\\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  downloadBlob(blob,'garranty_records.csv');
}
function backup(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'rasan-warranty-backup.json');}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function restore(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.stores||!x.records)throw 0;db=x;db.records.forEach(r=>r.codes=sortCodes(r.codes.join('\\n')));persist();renderStores();renderSelect();renderRecords();alert('پشتیبان با موفقیت بازیابی شد.');}catch{alert('فایل پشتیبان معتبر نیست.')}};rd.readAsText(f);e.target.value='';}
function clearAll(){if(confirm('همه اطلاعات این برنامه حذف شود؟')){db={stores:[],records:[]};persist();renderStores();renderSelect();renderRecords();}}
const codesEl=document.getElementById('codes'),countEl=document.getElementById('count');
renderStores();renderSelect();renderRecords();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
