<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.json"><title>مدیریت گارانتی</title><style>
body{font-family:Tahoma;background:#f3f6f9;margin:0}.box{max-width:850px;margin:auto;padding:14px}.card{background:white;padding:16px;border-radius:16px;margin:10px 0;box-shadow:0 2px 10px #0001}h1,h2{color:#1565c0}label{font-weight:bold;display:block;margin:8px 0 4px}input,textarea,select,button{width:100%;padding:11px;box-sizing:border-box;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#1565c0;color:white;border:0;margin-top:7px}.danger{background:#c62828}.gray{background:#607d8b}.wa{background:#25d366}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.record{border:1px solid #ddd;border-radius:12px;padding:10px;margin-top:8px}.small{font-size:12px;color:#666}@media(max-width:600px){.grid,.grid3,.codes{grid-template-columns:1fr}}</style></head><body><div class="box">
<div class="card"><h1>🛡️ مدیریت گارانتی و خدمات پس از فروش</h1></div>
<div class="card"><h2>ثبت اطلاعات</h2><input id="editId" type="hidden"><label>نام یا نام فروشگاه</label><input id="name"><div class="grid3"><div><label>تماس ۱</label><input id="p1" type="tel"></div><div><label>تماس ۲</label><input id="p2" type="tel"></div><div><label>تماس ۳</label><input id="p3" type="tel"></div></div><label>آدرس</label><textarea id="addr"></textarea><label>شهر</label><input id="city"><div class="grid"><div><label>تعداد کارت تحویل شده</label><input id="count" type="number" min="20" max="30" value="20" oninput="makeCodes()"></div><div><label>تاریخ تحویل شمسی</label><input id="date" placeholder="۱۴۰۵/۰۶/۱۶"></div></div><label>نوع کارت</label><select id="type"><option>گلد</option><option>سام</option><option>بوش</option><option>لوازم خرده ریز</option></select><label>شماره‌های گارانتی (۲۰ تا ۳۰ کد)</label><div id="codes" class="codes"></div><div class="grid"><button onclick="save()">💾 ثبت</button><button class="gray" onclick="clearForm()">پاک کردن</button></div></div>
<div class="card"><h2>جستجو</h2><input id="q" oninput="render()" placeholder="نام، شهر، تلفن یا کد گارانتی"><div class="grid"><button onclick="exportCSV()">📊 خروجی Excel</button><button class="gray" onclick="backup()">🛡️ پشتیبان‌گیری</button><button class="gray" onclick="restore()">♻️ بازیابی</button><button class="danger" onclick="wipe()">🗑️ حذف همه</button></div><div id="list"></div></div></div>
<script>
const K="warranty_data_v1";let data=JSON.parse(localStorage.getItem(K)||"[]");
const $=id=>document.getElementById(id);
function pd(s){return String(s||"").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])}
function makeCodes(){let n=Math.max(20,Math.min(30,+$("count").value||20));$("codes").innerHTML="";for(let i=1;i<=n;i++){let x=document.createElement("input");x.id="c"+i;x.placeholder="کد "+i;$("codes").appendChild(x)}}
function save(){let n=$("name").value.trim(),count=+$("count").value||20;if(!n)return alert("نام را وارد کنید");if(count<20||count>30)return alert("تعداد کارت باید ۲۰ تا ۳۰ باشد");let codes=[...document.querySelectorAll("#codes input")].map(x=>x.value.trim()).filter(Boolean);let x={id:$("editId").value||Date.now().toString(),name:n,p1:$("p1").value,p2:$("p2").value,p3:$("p3").value,addr:$("addr").value,city:$("city").value,count,date:$("date").value,type:$("type").value,codes};let i=data.findIndex(a=>a.id===x.id);i>=0?data[i]=x:data.unshift(x);localStorage.setItem(K,JSON.stringify(data));clearForm();render();alert("ثبت شد")}
function clearForm(){$("editId").value="";["name","p1","p2","p3","addr","city"].forEach(i=>$(i).value="");$("count").value=20;$("date").value="";$("type").value="گلد";makeCodes()}
function edit(id){let x=data.find(a=>a.id===id);$("editId").value=x.id;$("name").value=x.name;$("p1").value=x.p1;$("p2").value=x.p2;$("p3").value=x.p3;$("addr").value=x.addr;$("city").value=x.city;$("count").value=x.count;$("date").value=x.date;$("type").value=x.type;makeCodes();x.codes.forEach((c,i)=>{if($("c"+(i+1))){$("c"+(i+1)).value=c}});scrollTo(0,0)}
function del(id){if(confirm("حذف شود؟")){data=data.filter(x=>x.id!==id);localStorage.setItem(K,JSON.stringify(data));render()}}
function waText(x){return `🛡️ گارانتی\nفروشگاه: ${x.name}\nشهر: ${x.city||"—"}\nتلفن: ${[x.p1,x.p2,x.p3].filter(Boolean).join(" - ")}\nآدرس: ${x.addr||"—"}\nنوع کارت: ${x.type}\nتعداد کارت: ${x.count}\nتاریخ تحویل: ${x.date||"—"}\n\nکدهای گارانتی:\n${x.codes.map((c,i)=>(i+1)+". "+c).join("\n")}`}
function copyWA(id){navigator.clipboard.writeText(waText(data.find(x=>x.id===id))).then(()=>alert("اطلاعات برای واتساپ کپی شد"))}
function openWA(id){let x=data.find(a=>a.id===id),p=(x.p1||x.p2||x.p3||"").replace(/\D/g,"");window.open((p?"https://wa.me/"+p+"?text=":"https://wa.me/?text=")+encodeURIComponent(waText(x)))}
function render(){let q=$("q").value.toLowerCase(),a=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$("list").innerHTML=a.map(x=>`<div class="record"><b>${esc(x.name)}</b><br>نوع کارت: ${esc(x.type)} | تعداد: ${x.count} | تاریخ: ${esc(x.date)}<br>📞 ${esc([x.p1,x.p2,x.p3].filter(Boolean).join(" | "))}<br>📍 ${esc(x.city)}<details><summary>کدها (${x.codes.length})</summary>${x.codes.map((c,i)=>(i+1)+". "+esc(c)).join("<br>")}</details><div class="grid"><button onclick="location.href='tel:${esc(x.p1||x.p2||x.p3||"")}'">📞 تماس</button><button onclick="location.href='sms:${esc(x.p1||x.p2||x.p3||"")}'">💬 پیامک</button><button class="wa" onclick="openWA('${x.id}')">WhatsApp</button><button class="gray" onclick="copyWA('${x.id}')">📋 کپی واتساپ</button><button class="gray" onclick="edit('${x.id}')">✏️ ویرایش</button><button class="danger" onclick="del('${x.id}')">🗑️ حذف</button></div></div>`).join("")||"<p>موردی پیدا نشد.</p>"}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="پشتیبان_گارانتی.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);localStorage.setItem(K,JSON.stringify(data));render();alert("بازیابی شد")}catch(e){alert("فایل نامعتبر است")}};r.readAsText(i.files[0])};i.click()}
function exportCSV(){let rows=[["نام فروشگاه","تماس۱","تماس۲","تماس۳","آدرس","شهر","تعداد کارت","تاریخ شمسی","نوع کارت","کدهای گارانتی"],...data.map(x=>[x.name,x.p1,x.p2,x.p3,x.addr,x.city,x.count,x.date,x.type,x.codes.join(" | ")] )];let csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="گزارش_گارانتی.csv";a.click()}
function wipe(){if(confirm("همه اطلاعات حذف شود؟")){data=[];localStorage.setItem(K,"[]");render()}}
makeCodes();render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
