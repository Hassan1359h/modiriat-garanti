<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a4b">
<link rel="manifest" href="manifest.webmanifest">
<title>مدیریت گارانتی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f9;color:#17202a}
header{background:#0b7a4b;color:#fff;padding:16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}main{max-width:1050px;margin:auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #00000010}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,select,button,textarea{font:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3d8;border-radius:9px;background:#fff}
textarea{min-height:75px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;background:#0b7a4b;color:#fff}
button.secondary{background:#60717c}button.warn{background:#c62828}button.blue{background:#1976d2}
button.light{background:#edf2f4;color:#17202a}.small{font-size:12px;color:#65727b}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}
.code-row{display:flex;gap:5px;align-items:center}.code-row input{direction:ltr;text-align:left}
.item{border:1px solid #e0e5e8;border-radius:12px;padding:12px;margin:9px 0}
.item h3{margin:0 0 7px;font-size:16px}.badge{display:inline-block;background:#e8f5ee;color:#09633f;border-radius:20px;padding:4px 8px;font-size:12px;margin:2px}
.hidden{display:none!important}.danger{color:#b71c1c}.success{color:#087443}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:9px;display:none;z-index:20}
</style>
</head>
<body>
<header><h1>🛡️ مدیریت گارانتی و کارت تحویل</h1></header>
<main>
<section class="card">
<h2>ثبت اطلاعات</h2>
<div class="grid">
<div><label>👤 نام یا نام فروشگاه</label><input id="name"></div>
<div><label>📞 شماره تماس ۱</label><input id="phone1" inputmode="tel"></div>
<div><label>📞 شماره تماس ۲</label><input id="phone2" inputmode="tel"></div>
<div><label>📞 شماره تماس ۳</label><input id="phone3" inputmode="tel"></div>
<div><label>📍 شهر</label><input id="city"></div>
<div style="grid-column:1/-1"><label>🏠 آدرس</label><textarea id="address"></textarea></div>
<div><label>🎫 تعداد کارت تحویل‌شده (۲۰ تا ۳۰)</label><input id="cardCount" type="number" min="20" max="30" value="20"></div>
<div><label>📅 تاریخ تحویل شمسی</label><input id="date" placeholder="مثلاً ۱۴۰۵/۰۶/۱۷"></div>
<div><label>🛡️ نوع کارت</label><select id="cardType"><option>گلد</option><option>سام</option><option>بوش</option><option>لوازم خرده‌ریز</option></select></div>
</div>
<div style="margin-top:12px"><label>🔢 کدهای گارانتی (دقیقاً به تعداد کارت؛ بدون شماره‌گذاری خودکار)</label>
<div id="codes" class="codes"></div>
<p class="small">کدها فقط خودِ کد هستند؛ برنامه هیچ «.10» یا «.11» و هیچ شماره ترتیبی به آن‌ها اضافه نمی‌کند.</p></div>
<div class="actions"><button id="save">💾 ذخیره</button><button class="light" id="clear">پاک کردن فرم</button></div>
</section>

<section class="card">
<h2>🔎 جستجو</h2>
<input id="search" placeholder="جستجوی نام، شهر، تلفن یا کد گارانتی">
<div id="list"></div>
</section>

<section class="card">
<h2>📊 مدیریت اطلاعات</h2>
<div class="actions">
<button id="csv">📄 خروجی CSV</button>
<button id="excel" class="blue">📊 خروجی Excel</button>
<button id="backup" class="secondary">🛡️ پشتیبان‌گیری</button>
<button id="restore" class="secondary">♻️ بازیابی اطلاعات</button>
<input id="file" type="file" accept=".json" class="hidden">
</div>
<p class="small">اطلاعات در LocalStorage همین مرورگر/دستگاه ذخیره می‌شود و به سرور ارسال نمی‌شود.</p>
</section>
</main>
<div id="toast"></div>
<script>
const KEY="warranty_manager_v1";
const WA_GROUP="https://chat.whatsapp.com/ElqzeVcWaJiANem5X1hflO";
let records=JSON.parse(localStorage.getItem(KEY)||"[]"), editing=null;

const $=id=>document.getElementById(id);
function toast(s){let t=$("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function faNum(s){return String(s??"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))}
function renderCodeInputs(n, values=[]){
 n=Math.max(20,Math.min(30,Number(n)||20)); $("cardCount").value=n;
 $("codes").innerHTML="";
 for(let i=0;i<n;i++){
   let d=document.createElement("div"); d.className="code-row";
   let inp=document.createElement("input"); inp.className="gcode"; inp.inputMode="numeric"; inp.placeholder="کد گارانتی"; inp.value=values[i]||"";
   d.append(inp); $("codes").append(d);
 }
}
$("cardCount").addEventListener("input",e=>renderCodeInputs(e.target.value));
renderCodeInputs(20);

function formData(){
 let n=Number($("cardCount").value);
 if(n<20||n>30) throw Error("تعداد کارت باید بین ۲۰ تا ۳۰ باشد.");
 let codes=[...document.querySelectorAll(".gcode")].map(x=>faNum(x.value.trim()));
 if(codes.length!==n) throw Error("تعداد کدها با تعداد کارت‌ها برابر نیست.");
 if(codes.some(x=>!x)) throw Error("همه کدهای گارانتی را وارد کنید.");
 return {id:editing||crypto.randomUUID(),name:$("name").value.trim(),phones:[$("phone1").value.trim(),$("phone2").value.trim(),$("phone3").value.trim()].filter(Boolean),
 city:$("city").value.trim(),address:$("address").value.trim(),cardCount:n,date:$("date").value.trim(),cardType:$("cardType").value,codes,updatedAt:new Date().toISOString()};
}
function save(){
 try{let r=formData(); let i=records.findIndex(x=>x.id===r.id); if(i>=0)records[i]=r;else records.unshift(r);
 localStorage.setItem(KEY,JSON.stringify(records)); editing=null; clearForm(); render(); toast("ذخیره شد");}
 catch(e){alert(e.message)}
}
function clearForm(){editing=null;["name","phone1","phone2","phone3","city","address","date"].forEach(id=>$(id).value="");$("cardType").value="گلد";renderCodeInputs(20);$("save").textContent="💾 ذخیره"}
function edit(id){let r=records.find(x=>x.id===id);if(!r)return;editing=id;
$("name").value=r.name;$("phone1").value=r.phones[0]||"";$("phone2").value=r.phones[1]||"";$("phone3").value=r.phones[2]||"";
$("city").value=r.city;$("address").value=r.address;$("cardCount").value=r.cardCount;$("date").value=r.date;$("cardType").value=r.cardType;renderCodeInputs(r.cardCount,r.codes);$("save").textContent="✏️ ذخیره ویرایش";scrollTo({top:0,behavior:"smooth"})}
function remove(id){if(confirm("این اطلاعات حذف شود؟")){records=records.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(records));render();toast("حذف شد")}}
function text(r){
 return `🛡️ اطلاعات گارانتی
👤 ${r.name}
📞 ${r.phones.join(" | ")}
🏠 ${r.address}
📍 ${r.city}
🎫 تعداد کارت: ${r.cardCount}
📅 تاریخ تحویل: ${r.date}
🛡️ نوع کارت: ${r.cardType}
🔢 کدهای گارانتی:
${r.codes.join("\\n")}`;
}
async function copy(r){await navigator.clipboard.writeText(text(r));toast("کامل کپی شد؛ آماده ارسال در واتساپ")}
function whatsapp(r){
 // WhatsApp cannot programmatically choose a specific group from a normal web/PWA link.
 // We copy the complete message and open the group invite; user taps the group and pastes/sends.
 copy(r); setTimeout(()=>window.open(WA_GROUP,"_blank","noopener"),250);
}
function call(r){let p=r.phones[0];if(p)location.href="tel:"+p}
function sms(r){let p=r.phones[0];if(p)location.href="sms:"+p+"?body="+encodeURIComponent(text(r))}
function render(){
 let q=$("search").value.trim().toLowerCase();let out=records.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 $("list").innerHTML=out.length?out.map(r=>`<div class="item"><h3>👤 ${esc(r.name)} <span class="badge">${esc(r.cardType)}</span></h3>
 <div>📍 ${esc(r.city)} | 📞 ${esc(r.phones.join("، "))} | 🎫 ${r.cardCount} کارت | 📅 ${esc(r.date)}</div>
 <div class="small">کدها: ${r.codes.map(esc).join("، ")}</div>
 <div class="actions"><button onclick="whatsapp(records.find(x=>x.id==='${r.id}'))">🟢 واتساپ</button><button class="light" onclick="copy(records.find(x=>x.id==='${r.id}'))">📋 کپی</button><button class="blue" onclick="call(records.find(x=>x.id==='${r.id}'))">📞 تماس</button><button class="secondary" onclick="sms(records.find(x=>x.id==='${r.id}'))">💬 پیامک</button><button onclick="edit('${r.id}')">✏️ ویرایش</button><button class="warn" onclick="remove('${r.id}')">🗑️ حذف</button></div></div>`).join(""):"<p class='small'>اطلاعاتی پیدا نشد.</p>";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function csvExport(){
 let rows=[["نام/فروشگاه","تلفن ۱","تلفن ۲","تلفن ۳","آدرس","شهر","تعداد کارت","تاریخ تحویل","نوع کارت","کدهای گارانتی"]];
 records.forEach(r=>rows.push([r.name,r.phones[0]||"",r.phones[1]||"",r.phones[2]||"",r.address,r.city,r.cardCount,r.date,r.cardType,r.codes.join(" | ")]));
 let csv="\\ufeff"+rows.map(a=>a.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\\n");
 download(new Blob([csv],{type:"text/csv;charset=utf-8"}),"guarantee.csv");
}
function excelExport(){csvExport();toast("فایل CSV سازگار با Excel ساخته شد")}
function download(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function backup(){download(new Blob([JSON.stringify(records,null,2)],{type:"application/json"}),"guarantee-backup.json")}
$("restore").onclick=()=>$("file").click();
$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x))throw 0;records=x;localStorage.setItem(KEY,JSON.stringify(records));render();toast("بازیابی شد")}catch{alert("فایل پشتیبان معتبر نیست.")}};rd.readAsText(f)};
$("save").onclick=save;$("clear").onclick=clearForm;$("search").oninput=render;$("csv").onclick=csvExport;$("excel").onclick=excelExport;$("backup").onclick=backup;
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
