<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<title>مدیریت فروشگاه و گارانتی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#17202a}
header{background:#1565c0;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
header h1{margin:0 0 5px;font-size:20px}header p{margin:0;font-size:12px}
main{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{font-size:12px;color:#53606d}input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;margin-top:5px;border:1px solid #ccd5df;border-radius:9px;padding:10px;background:#fff}
textarea{min-height:150px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:0;border-radius:9px;padding:10px 13px;background:#1565c0;color:#fff;cursor:pointer}
button.secondary{background:#607d8b}button.success{background:#2e7d32}button.danger{background:#c62828}button.light{background:#e8eef5;color:#17324d}
.small{font-size:12px;color:#667}.search{margin-bottom:10px}.list{display:grid;gap:10px}
.item,.person{border:1px solid #e1e7ee;border-radius:11px;padding:11px;background:#fff}
.item strong,.person strong{display:block;margin-bottom:5px}.meta{font-size:12px;color:#59636e;line-height:1.8}
.codes{white-space:pre-wrap;direction:ltr;text-align:left;background:#f7f9fb;padding:9px;border-radius:8px;margin-top:8px;font-family:monospace;line-height:1.65}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#e3f2fd;color:#1565c0;font-size:11px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.empty{text-align:center;color:#78838d;padding:18px}
@media(max-width:600px){main{padding:9px}.card{padding:12px}button{flex:1;min-width:120px}}
</style>
</head>
<body>
<header><h1>🛡️ مدیریت فروشگاه و گارانتی</h1><p>ثبت و مدیریت فروشگاه‌ها، افراد و کدهای گارانتی</p></header>
<main>

<section class="card">
<h2>👤 ثبت اطلاعات فروشگاه / شخص</h2>
<div class="grid">
<label>نام فروشگاه / شخص<input id="storeName" placeholder="مثلاً فروشگاه راسان - مبین رسولی"></label>
<label>تلفن ۱<input id="phone1" inputmode="tel"></label>
<label>تلفن ۲<input id="phone2" inputmode="tel"></label>
<label>تلفن ۳<input id="phone3" inputmode="tel"></label>
<label>شهر<input id="city"></label>
<label>آدرس<input id="address"></label>
</div>
<div class="actions"><button class="success" onclick="saveStore()">ذخیره اطلاعات</button><button class="light" onclick="clearStoreForm()">پاک کردن فرم</button></div>
<div id="storesList" class="list" style="margin-top:12px"></div>
</section>

<section class="card">
<h2>🎫 ثبت گارانتی</h2>
<div class="grid">
<label>انتخاب فروشگاه / شخص<select id="storeSelect"><option value="">— انتخاب کنید —</option></select></label>
<label>تعداد کارت<input id="count" type="number" min="1" max="500" value="30"></label>
<label>تاریخ تحویل<input id="date" placeholder="1405/06/15"></label>
<label>نوع کارت<select id="type"><option>گلد</option><option>سام</option><option>بوش</option><option>لوازم خرده‌ریز</option></select></label>
</div>
<label style="display:block;margin-top:10px">کدهای گارانتی — هر کد فقط خودش، یک کد در هر خط
<textarea id="codes" dir="ltr" placeholder="78600
78601
78602"></textarea></label>
<div class="small">فقط خود کد ذخیره می‌شود؛ هیچ شماره ردیف، n، \n، نقطه یا متن اضافی کنار کد قرار نمی‌گیرد. کدهای عددی صعودی مرتب می‌شوند.</div>
<div class="actions"><button class="success" onclick="saveWarranty()">ثبت گارانتی</button><button class="light" onclick="clearWarrantyForm()">پاک کردن فرم</button></div>
</section>

<section class="card">
<h2>🔎 افراد و فروشگاه‌ها</h2>
<input id="search" class="search" placeholder="جستجو با نام، فروشگاه، شهر، تلفن یا کد..." oninput="renderAll()">
<div id="peopleList" class="people"></div>
</section>

<section class="card">
<h2>🛡️ سوابق گارانتی</h2>
<div id="recordsList" class="list"></div>
</section>

<section class="card">
<h2>💾 پشتیبان و خروجی</h2>
<div class="actions">
<button onclick="exportCSV()">خروجی CSV برای Excel</button>
<button class="secondary" onclick="backup()">پشتیبان‌گیری</button>
<button class="secondary" onclick="document.getElementById('restoreFile').click()">بازیابی پشتیبان</button>
<button class="danger" onclick="clearAll()">حذف همه اطلاعات</button>
</div>
<input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restore(event)">
</section>
</main>

<script>
const KEY='rasanWarrantyManager_v3';
let db=JSON.parse(localStorage.getItem(KEY)||'{"stores":[],"records":[]}');

function persist(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function normalizeDigits(s){
 return String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}

/* پاک‌سازی قطعی کد: خروجی این تابع فقط خود کد است. */
function cleanCode(raw){
 let s=normalizeDigits(raw).trim();
 s=s.replace(/\\n/g,' ').replace(/\bn\b/gi,' ').trim();
 s=s.replace(/^\s*\d+\s*[\)\.\-:]\s*/,'').trim();
 s=s.replace(/^\s*\d+\s+(?=\d{3,}[A-Za-z\u0600-\u06FF]*$)/,'').trim();
 s=s.replace(/[^\p{L}\p{N}_-]/gu,'');
 return s;
}
function sortCodes(raw){
 let lines=Array.isArray(raw)?raw:String(raw??'').split(/\r?\n/),arr=[];
 lines.forEach(line=>{
   let parts=String(line).trim().split(/[,\u060c;]+/).filter(Boolean);
   if(!parts.length) return;
   parts.forEach(p=>{let c=cleanCode(p);if(c)arr.push(c);});
 });
 return [...new Set(arr)].sort((a,b)=>{
   if(/^\d+$/.test(a)&&/^\d+$/.test(b))return Number(a)-Number(b);
   return a.localeCompare(b,'fa',{numeric:true,sensitivity:'base'});
 });
}
function saveStore(){
 let s={id:crypto.randomUUID(),name:storeName.value.trim(),phone1:phone1.value.trim(),phone2:phone2.value.trim(),phone3:phone3.value.trim(),city:city.value.trim(),address:address.value.trim()};
 if(!s.name){alert('نام فروشگاه / شخص را وارد کنید.');return}
 let old=db.stores.find(x=>x.name===s.name&&x.city===s.city&&x.address===s.address);
 if(old)Object.assign(old,s,{id:old.id});else db.stores.push(s);
 persist();renderAll();clearStoreForm();alert('اطلاعات ذخیره شد.');
}
function clearStoreForm(){['storeName','phone1','phone2','phone3','city','address'].forEach(id=>document.getElementById(id).value='');}
function selectStore(id){
 storeSelect.value=id;
 window.scrollTo({top:document.getElementById('storeSelect').getBoundingClientRect().top+scrollY-100,behavior:'smooth'});
}
function deleteStore(id){
 if(confirm('فروشگاه/شخص حذف شود؟ سوابق گارانتی حذف نمی‌شوند.')){
   db.stores=db.stores.filter(s=>s.id!==id);persist();renderAll();
 }
}
function saveWarranty(){
 let s=db.stores.find(x=>x.id===storeSelect.value);
 if(!s){alert('ابتدا فروشگاه / شخص را ذخیره و انتخاب کنید.');return}
 let codes=sortCodes(codesEl.value),wanted=Number(countEl.value||0);
 if(!codes.length){alert('حداقل یک کد وارد کنید.');return}
 if(wanted&&codes.length!==wanted&&!confirm(`تعداد کارت ${wanted} است ولی ${codes.length} کد وارد شده. با همین تعداد ثبت شود؟`))return;
 db.records.unshift({id:crypto.randomUUID(),storeId:s.id,store:{...s},count:codes.length,date:date.value.trim(),type:type.value,codes});
 persist();renderAll();clearWarrantyForm();alert('گارانتی ثبت شد؛ کدها پاک‌سازی و مرتب شدند.');
}
function clearWarrantyForm(){codesEl.value='';date.value='';countEl.value=30;}
function recordText(r){
 let s=r.store||{};
 return `🛡️ اطلاعات گارانتی
👤 ${s.name||''}
📞 ${[s.phone1,s.phone2,s.phone3].filter(Boolean).join(' | ')}
🏠 ${s.address||''} | ${s.city||''}
📍 ${s.city||''}
🎫 تعداد کارت: ${r.codes.length}
📅 تاریخ تحویل: ${r.date||''}
🛡️ نوع کارت: ${r.type||''}
🔢 کدهای گارانتی:
${r.codes.join('\n')}`;
}
async function copyRecord(id){
 let r=db.records.find(x=>x.id===id);if(!r)return;
 await navigator.clipboard.writeText(recordText(r));alert('اطلاعات کامل کپی شد.');
}
function wa(id){
 let r=db.records.find(x=>x.id===id),p=(r.store.phone1||r.store.phone2||r.store.phone3||'').replace(/\D/g,'');
 window.open(`https://wa.me/${p}?text=${encodeURIComponent(recordText(r))}`,'_blank');
}
function sms(id){
 let r=db.records.find(x=>x.id===id),p=(r.store.phone1||r.store.phone2||r.store.phone3||'').replace(/\D/g,'');
 location.href=`sms:${p}?body=${encodeURIComponent(recordText(r))}`;
}
function call(id){
 let r=db.records.find(x=>x.id===id);location.href=`tel:${r.store.phone1||r.store.phone2||r.store.phone3||''}`;
}
function editRecord(id){
 let r=db.records.find(x=>x.id===id);if(!r)return;
 storeSelect.value=r.storeId;countEl.value=r.codes.length;date.value=r.date;type.value=r.type;codesEl.value=r.codes.join('\n');
 db.records=db.records.filter(x=>x.id!==id);persist();renderAll();
 window.scrollTo({top:document.getElementById('storeSelect').getBoundingClientRect().top+scrollY-100,behavior:'smooth'});
 alert('رکورد برای ویرایش در فرم بالا قرار گرفت. بعد از اصلاح «ثبت گارانتی» را بزنید.');
}
function deleteRecord(id){
 if(confirm('این ثبت گارانتی حذف شود?')){db.records=db.records.filter(x=>x.id!==id);persist();renderAll();}
}
function renderPeople(){
 let q=normalizeDigits(search.value).toLowerCase().trim();
 let arr=db.stores.filter(s=>!q||[s.name,s.city,s.address,s.phone1,s.phone2,s.phone3].some(v=>normalizeDigits(v).toLowerCase().includes(q)));
 peopleList.innerHTML=arr.length?arr.map(s=>`<div class="person"><strong>👤 ${esc(s.name)}</strong><div class="meta">📍 ${esc(s.city||'')}<br>🏠 ${esc(s.address||'')}<br>📞 ${[s.phone1,s.phone2,s.phone3].filter(Boolean).map(esc).join(' | ')}</div><div class="actions"><button onclick="selectStore('${s.id}')">انتخاب برای گارانتی</button></div></div>`).join(''):'<div class="empty">فرد یا فروشگاهی پیدا نشد.</div>';
}
function renderStores(){
 let q=normalizeDigits(search.value).toLowerCase().trim();
 let arr=db.stores.filter(s=>!q||[s.name,s.city,s.address,s.phone1,s.phone2,s.phone3].some(v=>normalizeDigits(v).toLowerCase().includes(q)));
 storesList.innerHTML=arr.length?arr.map(s=>`<div class="item"><strong>${esc(s.name)}</strong><div class="meta">📍 ${esc(s.city||'')} ${s.address?'— '+esc(s.address):''}<br>📞 ${[s.phone1,s.phone2,s.phone3].filter(Boolean).map(esc).join(' | ')}</div><div class="actions"><button class="light" onclick="selectStore('${s.id}')">انتخاب</button><button class="danger" onclick="deleteStore('${s.id}')">حذف</button></div></div>`).join(''):'<div class="empty">هنوز اطلاعاتی ثبت نشده است.</div>';
}
function renderSelect(){
 let cur=storeSelect.value;
 storeSelect.innerHTML='<option value="">— انتخاب کنید —</option>'+db.stores.map(s=>`<option value="${s.id}">${esc(s.name)}${s.city?' — '+esc(s.city):''}</option>`).join('');
 if(db.stores.some(s=>s.id===cur))storeSelect.value=cur;
}
function renderRecords(){
 let q=normalizeDigits(search.value).toLowerCase().trim();
 let arr=db.records.filter(r=>{
   let s=r.store||{};
   return !q||[s.name,s.city,s.address,s.phone1,s.phone2,s.phone3,r.type,r.date,...r.codes].some(v=>normalizeDigits(v).toLowerCase().includes(q));
 });
 recordsList.innerHTML=arr.length?arr.map(r=>`<div class="item"><strong>${esc(r.store?.name||'')} <span class="badge">${esc(r.type)}</span></strong><div class="meta">📍 ${esc(r.store?.city||'')} &nbsp; 📅 ${esc(r.date||'')} &nbsp; 🎫 ${r.codes.length} کد</div><div class="codes">${esc(r.codes.join('\n'))}</div><div class="actions"><button onclick="copyRecord('${r.id}')">کپی کامل</button><button onclick="wa('${r.id}')">واتساپ</button><button onclick="call('${r.id}')">تماس</button><button onclick="sms('${r.id}')">پیامک</button><button class="secondary" onclick="editRecord('${r.id}')">ویرایش</button><button class="danger" onclick="deleteRecord('${r.id}')">حذف</button></div></div>`).join(''):'<div class="empty">هنوز سابقه گارانتی وجود ندارد.</div>';
}
function renderAll(){renderStores();renderPeople();renderSelect();renderRecords();}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function exportCSV(){
 let rows=[['نام فروشگاه/شخص','تلفن۱','تلفن۲','تلفن۳','شهر','آدرس','تعداد کارت','تاریخ تحویل','نوع کارت','کدهای گارانتی']];
 db.records.forEach(r=>{let s=r.store||{};rows.push([s.name,s.phone1,s.phone2,s.phone3,s.city,s.address,r.codes.length,r.date,r.type,r.codes.join('\n')]);});
 let csv='\ufeff'+rows.map(x=>x.map(csvCell).join(',')).join('\r\n');
 downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'garranty_records.csv');
}
function backup(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'rasan-warranty-backup.json');}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function restore(e){
 let f=e.target.files[0];if(!f)return;let rd=new FileReader();
 rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.stores||!x.records)throw 0;x.records.forEach(r=>r.codes=sortCodes(r.codes||[]));db=x;persist();renderAll();alert('پشتیبان بازیابی شد.');}catch{alert('فایل پشتیبان معتبر نیست.')}};
 rd.readAsText(f);e.target.value='';
}
function clearAll(){if(confirm('همه اطلاعات حذف شود؟')){db={stores:[],records:[]};persist();renderAll();}}
const codesEl=document.getElementById('codes'),countEl=document.getElementById('count');
renderAll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
