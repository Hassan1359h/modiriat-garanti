<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="مدیریت محلی اطلاعات گارانتی">
<link rel="manifest" href="manifest.json">
<title>مدیریت گارانتی</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#2563eb;--danger:#dc2626;--ok:#16a34a;--border:#e2e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
header{background:#0f172a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:12px;color:#cbd5e1}
main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}
.card h2{font-size:16px;margin:0 0 12px}.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:bold;margin:8px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}textarea{min-height:75px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer;background:#e2e8f0;color:#0f172a}button.primary{background:var(--primary);color:#fff}button.ok{background:var(--ok);color:#fff}button.danger{background:var(--danger);color:#fff}button.dark{background:#0f172a;color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.phone-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:7px}
.search{position:sticky;top:82px;z-index:4}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eff6ff;color:#1d4ed8;padding:8px 12px;border-radius:999px;font-size:12px}
#records{display:grid;gap:10px}.record{border:1px solid var(--border);border-radius:14px;padding:13px;background:#fff}.record-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.record h3{margin:0;font-size:16px}.muted{color:var(--muted);font-size:12px;line-height:1.9}.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.code{direction:ltr;background:#f8fafc;border:1px solid #cbd5e1;border-radius:7px;padding:5px 8px;font-family:monospace;font-size:13px}
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.type-grid label{margin:0;font-weight:normal}.type-grid input{width:auto}
.empty{text-align:center;color:var(--muted);padding:25px}.notice{font-size:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;line-height:1.8}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.type-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>🛡️ مدیریت گارانتی</h1><div class="sub">ذخیره‌سازی کاملاً محلی روی همین گوشی</div></header>
<main>
<section class="card">
  <h2 id="formTitle">➕ ثبت فروشگاه / مشتری</h2>
  <div class="grid">
    <div><label>👤 نام یا نام فروشگاه</label><input id="name" required></div>
    <div><label>📍 شهر</label><input id="city"></div>
    <div class="full"><label>🏠 آدرس</label><textarea id="address"></textarea></div>
    <div class="full"><label>📞 شماره‌های تماس (حداکثر ۳)</label>
      <div id="phones"></div>
      <button type="button" onclick="addPhone()">➕ شماره</button>
    </div>
    <div><label>🎫 تعداد کارت تحویل‌شده (۲۰ تا ۳۰)</label><input id="cardCount" type="number" min="20" max="30" value="20"></div>
    <div><label>📅 تاریخ تحویل شمسی</label><input id="dateJ" placeholder="مثلاً ۱۴۰۵/۰۶/۱۷"></div>
    <div class="full"><label>🛡️ نوع کارت</label>
      <div class="type-grid">
        <label><input type="checkbox" value="گلد" class="ctype"> گلد</label>
        <label><input type="checkbox" value="سام" class="ctype"> سام</label>
        <label><input type="checkbox" value="بوش" class="ctype"> بوش</label>
        <label><input type="checkbox" value="لوازم خرده‌ریز" class="ctype"> لوازم خرده‌ریز</label>
      </div>
    </div>
    <div class="full"><label>🔢 کدهای گارانتی (۲۰ تا ۳۰ عدد، بدون شماره‌گذاری)</label>
      <textarea id="codes" dir="ltr" placeholder="هر کد در یک خط&#10;78905&#10;78906"></textarea>
      <div class="muted">کدها دقیقاً همان‌طور که وارد می‌کنید ذخیره می‌شوند؛ هیچ «.10» یا شماره‌ای به آنها اضافه نمی‌شود.</div>
    </div>
  </div>
  <div class="actions">
    <button class="primary" onclick="saveRecord()">💾 ذخیره</button>
    <button onclick="resetForm()">پاک کردن فرم</button>
  </div>
  <div id="formNotice"></div>
</section>

<section class="card search">
  <h2>🔎 جستجو</h2>
  <input id="search" oninput="render()" placeholder="نام، شهر، تلفن یا کد گارانتی...">
</section>

<section class="card">
  <div class="stats"><span class="pill" id="countStat">۰ رکورد</span><span class="pill">ذخیره محلی 📱</span></div>
  <div id="records" style="margin-top:12px"></div>
</section>

<section class="card">
  <h2>📦 پشتیبان‌گیری و خروجی</h2>
  <div class="actions">
    <button onclick="exportJSON()">🛡️ پشتیبان‌گیری</button>
    <label style="display:inline-block"><input type="file" id="restoreFile" accept=".json,application/json" onchange="restoreJSON(event)" style="display:none"><button type="button" onclick="document.getElementById('restoreFile').click()">♻️ بازیابی</button></label>
    <button onclick="exportCSV()">📄 خروجی CSV</button>
    <button onclick="exportExcel()">📊 خروجی Excel</button>
  </div>
</section>
</main>
<script>
const KEY='guarantee_records_v1';
const WA_GROUP='https://chat.whatsapp.com/ElqzeVcWaJiANem5X1hflO';
let editId=null;
const $=id=>document.getElementById(id);
function records(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function setRecords(a){localStorage.setItem(KEY,JSON.stringify(a))}
function addPhone(value=''){let row=document.createElement('div');row.className='phone-row';row.innerHTML=`<input class="phone" inputmode="tel" value="${esc(value)}" placeholder="مثلاً 0912..."><button type="button" onclick="this.parentElement.remove()">حذف</button>`;$('phones').appendChild(row)}
function resetForm(){editId=null;$('formTitle').textContent='➕ ثبت فروشگاه / مشتری';['name','city','address','dateJ','codes'].forEach(x=>$(x).value='');$('cardCount').value=20;document.querySelectorAll('.ctype').forEach(x=>x.checked=false);$('phones').innerHTML='';addPhone();$('formNotice').innerHTML=''}
function saveRecord(){
 let name=$('name').value.trim(), city=$('city').value.trim(), address=$('address').value.trim();
 let phone=[...document.querySelectorAll('.phone')].map(x=>x.value.trim()).filter(Boolean).slice(0,3);
 let count=Number($('cardCount').value), dateJ=$('dateJ').value.trim();
 let types=[...document.querySelectorAll('.ctype:checked')].map(x=>x.value);
 let codes=$('codes').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!name)return msg('نام الزامی است.');
 if(count<20||count>30)return msg('تعداد کارت باید بین ۲۰ تا ۳۰ باشد.');
 if(codes.length<20||codes.length>30)return msg('تعداد کد گارانتی باید بین ۲۰ تا ۳۰ عدد باشد.');
 let clean=[...new Set(codes)]; if(clean.length!==codes.length)return msg('کد گارانتی تکراری دارید.');
 let item={id:editId||crypto.randomUUID(),name,city,address,phone,cardCount:count,dateJ,types,codes:clean,updatedAt:new Date().toISOString()};
 let a=records(),i=a.findIndex(x=>x.id===item.id); if(i>=0)a[i]=item;else a.unshift(item);setRecords(a);resetForm();render();msg('با موفقیت ذخیره شد.','ok');
}
function msg(t,kind=''){ $('formNotice').innerHTML=`<div class="notice" style="${kind?'background:#f0fdf4;border-color:#bbf7d0':''}">${t}</div>`}
function render(){
 let q=$('search').value.trim().toLowerCase(),a=records().filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 $('countStat').textContent=`${a.length} رکورد`;
 $('records').innerHTML=a.length?a.map(card).join(''):'<div class="empty">رکوردی پیدا نشد.</div>';
}
function card(r){
 let info=`نام: ${r.name}\nشهر: ${r.city||'-'}\nآدرس: ${r.address||'-'}\nتلفن: ${r.phone.join('، ')||'-'}\nتعداد کارت: ${r.cardCount}\nتاریخ تحویل: ${r.dateJ||'-'}\nنوع کارت: ${r.types.join('، ')||'-'}\nکدهای گارانتی:\n${r.codes.join('\n')}`;
 return `<article class="record"><div class="record-head"><div><h3>👤 ${esc(r.name)}</h3><div class="muted">📍 ${esc(r.city||'-')} · 🎫 ${r.cardCount} کارت · 📅 ${esc(r.dateJ||'-')}</div></div><div class="muted">${r.types.map(esc).join(' | ')}</div></div>
 <div class="muted">🏠 ${esc(r.address||'-')}<br>📞 ${esc(r.phone.join(' · ')||'-')}</div>
 <div class="codes">${r.codes.map(c=>`<span class="code">${esc(c)}</span>`).join('')}</div>
 <div class="actions">
 <button onclick='copyText(${JSON.stringify(info)})'>📋 کپی کامل</button>
 <button class="ok" onclick='openWA(${JSON.stringify(info)})'>🟢 واتساپ</button>
 ${r.phone[0]?`<a href="tel:${esc(r.phone[0])}"><button>📞 تماس</button></a><a href="sms:${esc(r.phone[0])}"><button>💬 پیامک</button></a>`:''}
 <button onclick='editRecord(${JSON.stringify(r.id)})'>✏️ ویرایش</button><button class="danger" onclick='deleteRecord(${JSON.stringify(r.id)})'>🗑️ حذف</button>
 </div></article>`;
}
function editRecord(id){let r=records().find(x=>x.id===id);if(!r)return;editId=id;$('formTitle').textContent='✏️ ویرایش';$('name').value=r.name;$('city').value=r.city;$('address').value=r.address;$('cardCount').value=r.cardCount;$('dateJ').value=r.dateJ;$('codes').value=r.codes.join('\n');$('phones').innerHTML='';r.phone.forEach(addPhone);document.querySelectorAll('.ctype').forEach(x=>x.checked=r.types.includes(x.value));scrollTo({top:0,behavior:'smooth'})}
function deleteRecord(id){if(confirm('این رکورد حذف شود؟')){setRecords(records().filter(x=>x.id!==id));render()}}
async function copyText(t){await navigator.clipboard.writeText(t);alert('اطلاعات کامل کپی شد.')}
function openWA(t){navigator.clipboard?.writeText(t);window.open(WA_GROUP,'_blank');}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download(new Blob([JSON.stringify(records(),null,2)],{type:'application/json'}),'guarantee-backup.json')}
function exportCSV(){let a=records(),head=['نام','شهر','آدرس','تلفن۱','تلفن۲','تلفن۳','تعداد کارت','تاریخ شمسی','نوع کارت','کدهای گارانتی'];let rows=[head,...a.map(r=>[r.name,r.city,r.address,...[0,1,2].map(i=>r.phone[i]||''),r.cardCount,r.dateJ,r.types.join(' | '),r.codes.join(' | ')])];let csv='\\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\r\\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'guarantee.csv')}
function exportExcel(){let a=records();let html='<html dir="rtl"><meta charset="utf-8"><table border="1"><tr><th>نام</th><th>شهر</th><th>آدرس</th><th>تلفن۱</th><th>تلفن۲</th><th>تلفن۳</th><th>تعداد کارت</th><th>تاریخ شمسی</th><th>نوع کارت</th><th>کدهای گارانتی</th></tr>'+a.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.city)}</td><td>${esc(r.address)}</td><td>${esc(r.phone[0]||'')}</td><td>${esc(r.phone[1]||'')}</td><td>${esc(r.phone[2]||'')}</td><td>${r.cardCount}</td><td>${esc(r.dateJ)}</td><td>${esc(r.types.join(' | '))}</td><td>${esc(r.codes.join(' | '))}</td></tr>`).join('')+'</table></html>';download(new Blob([html],{type:'application/vnd.ms-excel'}),'guarantee.xls')}
function restoreJSON(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x))throw 0;if(confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟')){setRecords(x);render();alert('بازیابی انجام شد.')}}catch{alert('فایل پشتیبان معتبر نیست.')}};rd.readAsText(f);e.target.value=''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
resetForm();render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
